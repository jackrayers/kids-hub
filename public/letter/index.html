<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Letter to Santa</title>
  <meta name="theme-color" content="#2e9b6a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/ui.css">
  <style>
    /* Screen: a toolbar above a paper preview. Print: just the paper, US Letter. */
    @page { size: letter portrait; margin: 0.4in; }
    body.letter-app { background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 2px, transparent 3px) 0 0 / 30px 30px, #2e9b6a; padding-top: 0; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; max-width: 8.5in; margin: 0 auto 18px; }
    .toolbar .grow { flex: 1; }
    .print-btn {
      border: 0; border-radius: 20px; padding: 14px 24px 10px; background: var(--gold); color: var(--ink);
      font: 800 1.4rem/1 var(--font-fun); box-shadow: 0 5px 0 #c48d14;
    }
    .hint { color: #e9fff3; font-size: 1rem; max-width: 8.5in; margin: -8px auto 16px; }

    .paper {
      background: #fff; color: #222; width: min(100%, 8.5in); margin: 0 auto; border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      aspect-ratio: 8.5 / 11; padding: 4.5% 5.5%;
      display: flex; flex-direction: column; gap: 2.2%;
      font-family: var(--font-fun);
      container-type: inline-size;
      overflow: hidden;
      position: relative;
    }
    /* Holly corners in outline so kids can colour them in. */
    .corner { position: absolute; width: 17%; height: auto; pointer-events: none; }
    .corner.tl { top: 1.2%; left: 1.2%; }
    .corner.tr { top: 1.2%; right: 1.2%; transform: scaleX(-1); }
    .corner.bl { bottom: 1.2%; left: 1.2%; transform: scaleY(-1); }
    .corner.br { bottom: 1.2%; right: 1.2%; transform: scale(-1, -1); }
    .toolbar-lights { height: 46px; margin: 0 -20px 10px; }
    .dear { font: 700 9cqw/1 'Mountains of Christmas', var(--font-fun); text-align: center; margin: 0; }
    .line { display: flex; align-items: baseline; gap: 2cqw; font-size: 3.4cqw; font-weight: 700; }
    .line .fill { flex: 1; border-bottom: 0.35cqw dashed #999; min-height: 1.4em; }
    .trace {
      font: 800 7.5cqw/1 var(--font-fun); color: transparent;
      -webkit-text-stroke: 0.3cqw #555; letter-spacing: 0.08em;
    }
    .wants { flex: 1; min-height: 0; display: grid; gap: 1.6cqw 3cqw; grid-auto-rows: minmax(0, 1fr); }
    .wants.n1 { grid-template-columns: 1fr; padding: 0 22%; }
    .wants.n2, .wants.n3, .wants.n4 { grid-template-columns: repeat(2, 1fr); padding: 0 6%; }
    .wants.n5, .wants.n6 { grid-template-columns: repeat(3, 1fr); }
    .want { min-height: 0; padding: 0.6cqw; display: flex; flex-direction: column; align-items: center; gap: 1cqw; break-inside: avoid; }
    .want img { flex: 1; min-height: 0; width: 100%; object-fit: contain; mix-blend-mode: multiply; } /* off-white edges vanish on paper */
    .sign { display: flex; justify-content: flex-end; align-items: baseline; gap: 2cqw; font-size: 3.6cqw; font-weight: 700; padding-right: 16%; }
    .sign .trace { font-size: 6cqw; }
    .deco { display: flex; justify-content: center; gap: 3cqw; font-size: 4cqw; filter: grayscale(1); opacity: 0.55; }
    .dear { position: relative; z-index: 1; }

    @media print {
      body.letter-app { background: #fff; padding: 0; }
      .toolbar, .hint, .toolbar-lights { display: none !important; }
      .paper { box-shadow: none; border-radius: 0; width: 7.7in; height: 10.1in; aspect-ratio: auto; padding: 0.25in 0.35in; margin: 0; }
      .deco { opacity: 0.4; }
    }
  </style>
</head>
<body class="kid letter-app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="holly" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <g transform="translate(60 60) rotate(-160)"><path d="M0 0 Q5.0 -1.9 10 -8.3 Q16.0 -5.5 22 -15.3 Q28.0 -7.6 34 -16.8 Q40.0 -6.9 46 -12.3 Q54.0 -3.0 62 0 Q54.0 3.0 46 12.3 Q40.0 6.9 34 16.8 Q28.0 7.6 22 15.3 Q16.0 5.5 10 8.3 Q5.0 1.9 0 0 Z"/><path d="M4 0 H56" fill="none" stroke-width="2"/></g>
        <g transform="translate(60 60) rotate(-70)"><path d="M0 0 Q5.0 -1.9 10 -8.3 Q16.0 -5.5 22 -15.3 Q28.0 -7.6 34 -16.8 Q40.0 -6.9 46 -12.3 Q54.0 -3.0 62 0 Q54.0 3.0 46 12.3 Q40.0 6.9 34 16.8 Q28.0 7.6 22 15.3 Q16.0 5.5 10 8.3 Q5.0 1.9 0 0 Z"/><path d="M4 0 H56" fill="none" stroke-width="2"/></g>
        <circle cx="64" cy="66" r="9"/><circle cx="79" cy="70" r="8"/><circle cx="69" cy="81" r="8"/>
        <path d="M18 102 l4 -10 l4 10 l-10 -6 h12 z" stroke-width="2.5"/>
        <path d="M100 18 l4 -10 l4 10 l-10 -6 h12 z" stroke-width="2.5"/>
      </g>
    </defs>
  </svg>
  <div class="lights toolbar-lights" aria-hidden="true"></div>
  <div class="toolbar">
    <a class="back-btn" id="back" href="/catalog/" style="text-decoration:none">↩ Catalog</a>
    <span class="grow"></span>
    <button class="print-btn" id="print" type="button">🖨️ Print my letter</button>
  </div>
  <p class="hint">Grown-ups: if Print doesn’t open, use the Share button → Print.</p>

  <article class="paper" id="paper" aria-label="Letter to Santa">
    <svg class="corner tl" viewBox="-8 -8 136 136" aria-hidden="true"><use href="#holly"/></svg>
    <svg class="corner tr" viewBox="-8 -8 136 136" aria-hidden="true"><use href="#holly"/></svg>
    <svg class="corner bl" viewBox="-8 -8 136 136" aria-hidden="true"><use href="#holly"/></svg>
    <svg class="corner br" viewBox="-8 -8 136 136" aria-hidden="true"><use href="#holly"/></svg>
    <h1 class="dear">Dear Santa,</h1>
    <div class="line"><span>My name is</span> <span class="trace" id="name"></span></div>
    <div class="line"><span>I would love…</span></div>
    <div class="wants" id="wants"></div>
    <div class="sign"><span>Love,</span> <span class="trace" id="sign"></span></div>
    <div class="deco" aria-hidden="true">⭐ 🎄 🦌 🍪 🥛 🎄 ⭐</div>
  </article>

  <script type="module">
    import { kidApi, esc, session, watchForUpdates } from '/shared/api.js';
    watchForUpdates();

    const $ = (id) => document.getElementById(id);
    const kidId = new URLSearchParams(location.search).get('kid') || session.get('kh.kidId');
    if (!kidId) location.href = '/';
    $('back').href = `/catalog/?kid=${encodeURIComponent(kidId)}`;

    $('print').addEventListener('click', () => window.print());

    (async () => {
      try {
        const data = await kidApi(`/catalog?kid=${encodeURIComponent(kidId)}`);
        const toys = data.wishlist.map((id) => data.toys.find((t) => t.id === id)).filter(Boolean);
        $('name').textContent = data.kid.name;
        $('sign').textContent = data.kid.name;
        const wants = $('wants');
        wants.className = `wants n${Math.max(1, toys.length)}`;
        wants.innerHTML = toys.length
          ? toys.map((t) => `<div class="want"><img src="${esc(t.coloring)}" alt="${esc(t.title)}"></div>`).join('')
          : '<p style="text-align:center;font-size:3cqw;color:#888">Pick some toys in the catalog first!</p>';
        document.title = `${data.kid.name}’s Letter to Santa`;
      } catch (err) {
        $('wants').innerHTML = `<p>${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
