<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kids Hub</title>
  <meta name="theme-color" content="#bfe6ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kids Hub">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Chewy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/ui.css">
  <style>
    body.kid { padding-top: 0; background: var(--cream); }
    .sky {
      margin: 0 -20px 26px;
      padding: env(safe-area-inset-top) 20px 0;
      background: linear-gradient(180deg, #a9dcff 0%, #d8f0ff 70%, #eaf7ff 100%);
    }
    .sky .bunting { margin: 0 -20px; }
    .sky h1 { position: relative; z-index: 2; margin: 6px 0 4px; font-size: clamp(3rem, 10vw, 5.4rem); }
    .sky > h1.wordmark { display: flex; }
    .sky .greet { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 4px 0 8px; }
    .sky .greet .avatar { --size: 96px; box-shadow: 0 0 0 6px #fff, inset 0 -6px 0 rgba(0, 0, 0, 0.12); }
    .sky .greet h1 { margin: 0; font-size: clamp(2.6rem, 8vw, 4.4rem); }
    .sky .greet .stars { font-size: 1.6rem; padding: 6px 18px 4px 12px; box-shadow: 0 4px 0 rgba(122, 82, 0, 0.25); }
    .sky .edge { margin: 6px -20px -1px; width: calc(100% + 40px); }
    .sun { position: absolute; right: 6%; top: calc(env(safe-area-inset-top) + 42px); width: 110px; height: 110px; z-index: 1; }
    .cloud { top: 0; z-index: 1; opacity: 0.95; }
    .switch-row { display: flex; justify-content: flex-end; max-width: 900px; margin: -8px auto 18px; }
    .door .icon { transform: rotate(8deg); filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.15)); }
    .door.santa {
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.22) 2px, transparent 3px) 0 0 / 28px 28px,
        linear-gradient(150deg, var(--red) 0%, var(--red-deep) 100%);
    }
    .door.print {
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.16) 3px, transparent 4px) 0 0 / 34px 34px,
        linear-gradient(150deg, var(--plum) 0%, #5d3aa8 100%);
    }
    .door .label { font-family: 'Chewy', var(--font-fun); font-weight: 400; font-size: 2.6rem; letter-spacing: 0.01em; }
    @media (max-width: 600px) { .sun { width: 74px; height: 74px; right: 2%; } }
  </style>
</head>
<body class="kid">
  <header class="sky band" id="sky">
    <div class="bunting" aria-hidden="true"></div>

    <svg class="sun" viewBox="0 0 120 120" aria-hidden="true">
      <g class="spin" style="transform-box: fill-box">
        <g stroke="#ffc928" stroke-width="7" stroke-linecap="round">
          <line x1="60" y1="4" x2="60" y2="20"/><line x1="60" y1="100" x2="60" y2="116"/>
          <line x1="4" y1="60" x2="20" y2="60"/><line x1="100" y1="60" x2="116" y2="60"/>
          <line x1="20" y1="20" x2="31" y2="31"/><line x1="89" y1="89" x2="100" y2="100"/>
          <line x1="20" y1="100" x2="31" y2="89"/><line x1="89" y1="31" x2="100" y2="20"/>
        </g>
      </g>
      <circle cx="60" cy="60" r="30" fill="#ffd84a" stroke="#f5b82e" stroke-width="4"/>
      <circle cx="50" cy="56" r="3.5" fill="#2b2140"/><circle cx="70" cy="56" r="3.5" fill="#2b2140"/>
      <path d="M48 67 Q60 78 72 67" fill="none" stroke="#2b2140" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="43" cy="66" r="4" fill="#ff9a8a" opacity="0.7"/><circle cx="77" cy="66" r="4" fill="#ff9a8a" opacity="0.7"/>
    </svg>

    <svg class="cloud drift" style="top:70px;width:150px;animation-duration:70s;animation-delay:-20s" viewBox="0 0 150 70" aria-hidden="true">
      <path d="M20 60 C2 60 2 36 22 36 C22 14 52 8 62 26 C70 6 104 8 106 32 C126 28 140 44 130 60 Z" fill="#fff"/>
    </svg>
    <svg class="cloud drift" style="top:150px;width:110px;animation-duration:95s;animation-delay:-60s" viewBox="0 0 150 70" aria-hidden="true">
      <path d="M20 60 C2 60 2 36 22 36 C22 14 52 8 62 26 C70 6 104 8 106 32 C126 28 140 44 130 60 Z" fill="#fff"/>
    </svg>
    <svg class="cloud drift" style="top:40px;width:90px;animation-duration:120s;animation-delay:-100s;opacity:.8" viewBox="0 0 150 70" aria-hidden="true">
      <path d="M20 60 C2 60 2 36 22 36 C22 14 52 8 62 26 C70 6 104 8 106 32 C126 28 140 44 130 60 Z" fill="#fff"/>
    </svg>

    <h1 class="wordmark" id="title">Who’s playing?</h1>
    <div class="greet" id="greet" hidden></div>

    <svg class="edge" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 C150 0 300 0 450 30 C600 60 750 10 900 22 C1020 32 1110 50 1200 34 L1200 70 L0 70 Z" fill="#8fd47f"/>
      <path d="M0 52 C200 30 360 64 560 48 C760 32 900 62 1200 46 L1200 70 L0 70 Z" fill="#67bf5e"/>
      <path d="M0 64 C300 58 600 70 1200 62 L1200 70 L0 70 Z" fill="var(--cream)"/>
    </svg>
  </header>

  <!-- Screen 1: who's playing? -->
  <section id="picker" hidden>
    <div class="kid-grid" id="kid-grid"></div>
    <p class="empty" id="no-kids" hidden>No kids yet — ask a grown-up to add you!</p>
  </section>

  <!-- Screen 2: pick an app -->
  <section id="hub" hidden>
    <div class="switch-row"><button class="back-btn" id="switch-kid" type="button">↩ Switch</button></div>
    <div class="doors" id="doors"></div>
    <p class="empty" id="no-apps" hidden>Nothing here yet — ask a grown-up!</p>
  </section>

  <p class="empty" id="loading">Loading…</p>
  <a class="grownup-link" href="/admin/" aria-label="Grown-ups">⚙︎</a>

  <script type="module">
    import { kidApi, avatarHtml, esc, session, registerServiceWorker } from '/shared/api.js';
    import { setWordmark } from '/shared/whimsy.js';

    const $ = (id) => document.getElementById(id);
    let kids = [];
    let apps = [];
    let lockedKidId = null;

    setWordmark($('title'), 'Who’s playing?');

    function showPicker() {
      if (lockedKidId) return; // a tablet locked to one kid never shows the picker
      session.remove('kh.kidId');
      $('hub').hidden = true;
      $('greet').hidden = true;
      $('title').hidden = false;
      $('picker').hidden = false;
      $('no-kids').hidden = kids.length > 0;
      $('kid-grid').innerHTML = kids.map((k) => `
        <button class="kid-tile" type="button" data-id="${esc(k.id)}">
          ${avatarHtml(k)}
          <span class="name">${esc(k.name)}</span>
        </button>`).join('');
    }

    function showHub(kid) {
      session.set('kh.kidId', kid.id);
      $('picker').hidden = true;
      $('title').hidden = true;
      $('hub').hidden = false;
      $('switch-kid').hidden = !!lockedKidId;
      const greet = $('greet');
      greet.hidden = false;
      greet.innerHTML = `${avatarHtml(kid)}<h1 class="wordmark" id="hi"></h1>
        <span class="stars" aria-label="${kid.balance} stars">⭐ ${kid.balance}</span>`;
      setWordmark($('hi'), `Hi, ${kid.name}!`);

      const mine = apps.filter((a) => kid.apps?.[a.id]);
      $('no-apps').hidden = mine.length > 0;
      $('doors').innerHTML = mine.map((a) => `
        <a class="door ${esc(a.theme)} ${a.ready ? '' : 'soon'}"
           href="${a.ready ? `${esc(a.path)}?kid=${encodeURIComponent(kid.id)}` : '#'}"
           ${a.ready ? '' : 'aria-disabled="true"'}>
          <span class="icon">${esc(a.icon)}</span>
          <span class="label">${esc(a.name)}</span>
          <span class="sub">${esc(a.sub)}</span>
        </a>`).join('');
    }

    $('kid-grid').addEventListener('click', (e) => {
      const tile = e.target.closest('.kid-tile');
      if (!tile) return;
      const kid = kids.find((k) => k.id === tile.dataset.id);
      if (kid) showHub(kid);
    });
    $('switch-kid').addEventListener('click', showPicker);
    $('doors').addEventListener('click', (e) => {
      if (e.target.closest('.door[aria-disabled="true"]')) e.preventDefault();
    });

    async function load() {
      try {
        const data = await kidApi('/household');
        kids = data.kids;
        apps = data.apps;
        lockedKidId = data.device?.kid_id || null;
        document.title = `${data.household?.name || 'Kids'} Hub`;
        $('loading').hidden = true;
        const current = kids.find((k) => k.id === (lockedKidId || session.get('kh.kidId')));
        if (lockedKidId && !current) {
          $('loading').hidden = false;
          $('loading').textContent = 'Ask a grown-up to set up this tablet.';
          return;
        }
        current ? showHub(current) : showPicker();
      } catch (err) {
        $('loading').textContent = err.message;
      }
    }

    // Refresh balances when the tablet wakes up.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    load();
    registerServiceWorker();
  </script>
</body>
</html>
