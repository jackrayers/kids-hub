<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parent mode · Kids Hub</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/shared/ui.css">
</head>
<body class="grownup">
  <header class="gu-bar">
    <div class="gu-bar-top">
      <div>
        <h1 class="gu-title">Parent mode</h1>
        <div class="gu-who" id="who"></div>
      </div>
      <a class="btn small" href="/">Kid view</a>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="tokens" aria-selected="true">Tokens</button>
      <button role="tab" data-tab="kids">Kids</button>
      <button role="tab" data-tab="catalog">Catalog</button>
      <button role="tab" data-tab="shopping">Shopping</button>
      <button role="tab" data-tab="print">Print Shop</button>
      <button role="tab" data-tab="tablets">Tablets</button>
      <button role="tab" data-tab="grownups">Grown-ups</button>
    </nav>
  </header>

  <main class="gu" id="main"><p class="muted">Loading…</p></main>

  <dialog id="aud-dialog" class="aud">
    <form method="dialog" id="aud-form">
      <h2 style="margin:0">Who sees this?</h2>
      <p class="muted" style="margin:0" id="aud-item"></p>
      <label class="row aud-everyone"><input type="checkbox" id="aud-all"> <strong>Everyone</strong></label>
      <div id="aud-groups"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="model-dialog" class="zoom">
    <form method="dialog">
      <div class="zoom-frame checker"><canvas id="model-canvas" style="width:100%;aspect-ratio:1;display:block"></canvas></div>
      <div class="row" style="justify-content:space-between"><strong id="model-dialog-title"></strong><button class="btn">Close</button></div>
    </form>
  </dialog>

  <dialog id="zoom" class="zoom">
    <form method="dialog">
      <div class="zoom-frame"><img id="zoom-img" alt=""></div>
      <div class="row" style="justify-content:space-between"><strong id="zoom-label"></strong><button class="btn">Close</button></div>
    </form>
  </dialog>

  <dialog id="kid-dialog">
    <form method="dialog" id="kid-form">
      <h2 style="margin:0" id="kid-dialog-title">Kid</h2>
      <div id="kid-avatar-preview"></div>
      <div class="row" style="justify-content:center">
        <label class="btn small">Upload photo<input type="file" accept="image/*" id="kid-photo" hidden></label>
        <button class="btn small danger" type="button" id="kid-photo-remove">Remove photo</button>
      </div>
      <label class="field">Name<input name="name" maxlength="40" required></label>
      <div class="row">
        <label class="field grow">Emoji (if no photo)<input name="emoji" maxlength="8" placeholder="🦄"></label>
        <label class="field">Color<input name="color" type="color" value="#f5b82e"></label>
      </div>
      <div class="row">
        <label class="field grow">Birth year<input name="birth_year" type="number" inputmode="numeric" min="2008"></label>
        <label class="field grow">Screen style
          <select name="ui_mode">
            <option value="picture">Pictures (pre-reader)</option>
            <option value="reader">Pictures + words</option>
          </select>
        </label>
      </div>
      <label class="field">Household<select name="household_id" id="kid-household"></select></label>
      <fieldset style="border:1px solid var(--line);border-radius:12px;padding:10px 12px">
        <legend class="muted" style="padding:0 6px">Apps</legend>
        <div class="row" id="kid-apps"></div>
      </fieldset>
      <label class="row" style="gap:8px"><input type="checkbox" name="active" checked> Show on tablets</label>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save" id="kid-save">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    // Safety net: if parent mode's script fails to start, say so instead of sitting on "Loading…".
    window.__khErrors = [];
    addEventListener('error', (e) => { window.__khErrors.push(e.message || (e.target && e.target.src) || 'Unknown error'); }, true);
    addEventListener('unhandledrejection', (e) => { window.__khErrors.push(String(e.reason && e.reason.message || e.reason)); });
    setTimeout(() => {
      if (window.__khBooted) return;
      const main = document.getElementById('main');
      main.innerHTML = '<div class="card"><h2>Parent mode didn’t start</h2>' +
        '<p>This usually means an old copy of the app is stuck. Tap Reload. If it keeps happening, send Claude this:</p>' +
        '<p class="secret"></p><button class="btn primary" id="kh-fresh">Reload</button></div>';
      // A plain reload can reuse old copies of scripts; clear them first.
      document.getElementById('kh-fresh').onclick = async () => {
        try {
          const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
          await Promise.all(regs.map((r) => r.update()));
          if (window.caches) await Promise.all((await caches.keys()).map((k) => caches.delete(k)));
        } catch (e) { /* ignore */ }
        location.reload();
      };
      main.querySelector('.secret').textContent = (window.__khErrors.join(' | ') || 'No error reported') + ' — ' + navigator.userAgent;
    }, 8000);
  </script>
  <script type="module">
    import { adminApi, avatarHtml, esc, watchForUpdates } from '/shared/api.js';
    import { makeCutout } from '/shared/cutout.js';
    import { makeLineArt } from '/shared/lineart.js';
    import { trimToSquare } from '/shared/trim.js';
    import { FINISHES, finishOf, secondColor, swatchBackground } from '/shared/finishes.js';
    watchForUpdates();

    const $ = (sel, root = document) => root.querySelector(sel);
    const main = $('#main');
    const state = { me: null, apps: [], households: [], kids: [], tab: 'tokens', selectedKids: new Set(), editingKid: null };

    // ---------- helpers ----------
    function toast(text, isError = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (isError ? ' error' : '');
      t.textContent = text;
      document.body.append(t);
      setTimeout(() => t.remove(), 3200);
    }
    async function run(fn) {
      try { return await fn(); } catch (err) { toast(err.message, true); throw err; }
    }
    const when = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso.endsWith('Z') ? iso : iso.replace(' ', 'T') + 'Z');
      return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    };
    const householdOptions = (selected) => state.households
      .map((h) => `<option value="${esc(h.id)}" ${h.id === selected ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
    const defaultHousehold = () => state.me.adult.household_id || state.households[0]?.id;
    const isOwner = () => state.me.adult.role === 'owner';

    async function refreshCore() {
      const [h, k] = await Promise.all([adminApi('/households'), adminApi('/kids?all=1')]);
      if (!state.apps.length) state.apps = (await adminApi('/apps')).apps;
      state.households = h.households;
      state.kids = k.kids;
    }

    // ---------- tabs ----------
    $('#tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tab]');
      if (!b) return;
      state.tab = b.dataset.tab;
      document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
      render();
    });

    function render() {
      if (!state.households.length) return renderSetup();
      ({ tokens: renderTokens, kids: renderKids, catalog: renderCatalog, shopping: renderShopping, print: renderPrintShop, tablets: renderTablets, grownups: renderGrownups })[state.tab]();
    }

    // ---------- first run ----------
    function renderSetup() {
      main.innerHTML = `
        <div class="card">
          <h2>Welcome! Start by naming your household</h2>
          <p class="muted">Each family with its own tablets gets a household (yours, your sister’s…).</p>
          <form class="row" id="hh-form">
            <input class="grow" name="name" placeholder="The Rayers" required maxlength="60">
            <button class="btn primary">Create</button>
          </form>
        </div>`;
      $('#hh-form').addEventListener('submit', (e) => {
        e.preventDefault();
        run(async () => {
          await adminApi('/households', { method: 'POST', body: { name: e.target.elements.name.value } });
          state.me = await adminApi('/me');
          await refreshCore();
          state.tab = 'kids';
          document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-selected', x.dataset.tab === 'kids'));
          render();
        });
      });
    }

    // ---------- tokens ----------
    async function renderTokens() {
      const active = state.kids.filter((k) => k.active);
      main.innerHTML = `
        <div class="card">
          <h2>Give or take tokens</h2>
          ${active.length ? '' : '<p class="muted">Add some kids first.</p>'}
          <div class="chips" id="kid-chips">
            ${active.map((k) => `
              <button class="chip" type="button" data-id="${esc(k.id)}" aria-pressed="${state.selectedKids.has(k.id)}">
                ${avatarHtml(k)} ${esc(k.name)} <span class="muted">⭐ ${k.balance}</span>
              </button>`).join('')}
          </div>
          <div class="row" style="margin-top:14px">
            <input class="grow" id="reason" placeholder="What for? (e.g. Cleaned up toys)" maxlength="120">
          </div>
          <div class="amount-btns" style="margin-top:12px">
            ${[1, 2, 3, 5, 10].map((n) => `<button class="btn" data-delta="${n}">+${n}</button>`).join('')}
            <input id="custom-delta" type="number" inputmode="numeric" placeholder="±" style="width:80px">
            <button class="btn" id="custom-go">Apply</button>
          </div>
        </div>
        <div class="card"><h2>Recent</h2><ul class="list" id="ledger"><li class="muted">Loading…</li></ul></div>`;

      $('#kid-chips').addEventListener('click', (e) => {
        const c = e.target.closest('.chip');
        if (!c) return;
        state.selectedKids.has(c.dataset.id) ? state.selectedKids.delete(c.dataset.id) : state.selectedKids.add(c.dataset.id);
        c.setAttribute('aria-pressed', state.selectedKids.has(c.dataset.id));
      });

      const apply = (delta) => run(async () => {
        if (!state.selectedKids.size) return toast('Tap one or more kids first', true);
        if (!Number.isInteger(delta) || delta === 0) return toast('Enter a whole number', true);
        const reason = $('#reason').value.trim() || null;
        for (const kidId of state.selectedKids) {
          await adminApi('/ledger', { method: 'POST', body: { kid_id: kidId, delta, reason, kind: delta > 0 ? 'award' : 'adjust' } });
        }
        toast(`${delta > 0 ? '+' : ''}${delta} for ${state.selectedKids.size} kid${state.selectedKids.size > 1 ? 's' : ''}`);
        await refreshCore();
        renderTokens();
      });
      main.querySelectorAll('[data-delta]').forEach((b) => b.addEventListener('click', () => apply(Number(b.dataset.delta))));
      $('#custom-go').addEventListener('click', () => apply(Number($('#custom-delta').value)));

      const { entries } = await run(() => adminApi('/ledger?limit=40'));
      $('#ledger').innerHTML = entries.length ? entries.map((e) => `
        <li>
          <span class="${e.delta > 0 ? 'delta-pos' : 'delta-neg'}" style="width:48px">${e.delta > 0 ? '+' : ''}${e.delta}</span>
          <div class="main">
            <div><strong>${esc(e.kid_name)}</strong> · ${esc(e.reason || e.kind)}</div>
            <div class="meta">${esc(when(e.created_at))} · ${esc(e.actor)}</div>
          </div>
        </li>`).join('') : '<li class="muted">No tokens yet.</li>';
    }

    // ---------- kids ----------
    function renderKids() {
      main.innerHTML = state.households.map((h) => {
        const kids = state.kids.filter((k) => k.household_id === h.id);
        return `
          <div class="card">
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
              <h2 style="margin:0">${esc(h.name)}</h2>
              <button class="btn small" data-add-kid="${esc(h.id)}">+ Add kid</button>
            </div>
            ${kids.length ? `
              <div class="row muted" style="margin:4px 0 6px;font-size:0.85rem">
                ${state.apps.map((a) => `
                  <span>${esc(a.icon)} ${esc(a.name)} for everyone:</span>
                  <button class="btn small" data-hh-app="${esc(a.id)}" data-hh="${esc(h.id)}" data-on="1">On</button>
                  <button class="btn small" data-hh-app="${esc(a.id)}" data-hh="${esc(h.id)}" data-on="0">Off</button>`).join('<span style="width:8px"></span>')}
              </div>` : ''}
            <ul class="list">
              ${kids.length ? kids.map((k) => `
                <li>
                  ${avatarHtml(k)}
                  <div class="main">
                    <div><strong>${esc(k.name)}</strong> ${k.active ? '' : '<span class="pill off">hidden</span>'}</div>
                    <div class="meta">${k.birth_year ? `born ${k.birth_year} · ` : ''}${k.ui_mode === 'reader' ? 'pictures + words' : 'pictures'} · ⭐ ${k.balance}</div>
                    <div class="chips" style="margin-top:6px">
                      ${state.apps.map((a) => `
                        <button class="chip app-toggle" type="button" data-kid="${esc(k.id)}" data-app="${esc(a.id)}"
                          aria-pressed="${!!k.apps?.[a.id]}" title="${esc(a.name)}">${esc(a.icon)} ${esc(a.name)}</button>`).join('')}
                    </div>
                  </div>
                  <button class="btn small" data-edit-kid="${esc(k.id)}">Edit</button>
                </li>`).join('') : '<li class="muted">No kids yet.</li>'}
            </ul>
          </div>`;
      }).join('') + `
        <div class="card">
          <h2>Add another household</h2>
          <form class="row" id="hh-form">
            <input class="grow" name="name" placeholder="e.g. Aunt Sarah’s house" required maxlength="60">
            <button class="btn">Add</button>
          </form>
        </div>`;

      main.querySelectorAll('.app-toggle').forEach((b) => b.addEventListener('click', () => run(async () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on); // optimistic
        try {
          await adminApi(`/kids/${b.dataset.kid}`, { method: 'PATCH', body: { apps: { [b.dataset.app]: on } } });
        } catch (err) { b.setAttribute('aria-pressed', !on); throw err; }
        await refreshCore();
      })));
      main.querySelectorAll('[data-hh-app]').forEach((b) => b.addEventListener('click', () => run(async () => {
        const on = b.dataset.on === '1';
        const app = state.apps.find((a) => a.id === b.dataset.hhApp);
        await adminApi(`/households/${b.dataset.hh}/apps`, { method: 'POST', body: { app: app.id, enabled: on } });
        await refreshCore();
        renderKids();
        toast(`${app.name} turned ${on ? 'on' : 'off'} for everyone`);
      })));
      main.querySelectorAll('[data-add-kid]').forEach((b) => b.addEventListener('click', () => openKid(null, b.dataset.addKid)));
      main.querySelectorAll('[data-edit-kid]').forEach((b) => b.addEventListener('click', () =>
        openKid(state.kids.find((k) => k.id === b.dataset.editKid))));
      $('#hh-form').addEventListener('submit', (e) => {
        e.preventDefault();
        run(async () => {
          await adminApi('/households', { method: 'POST', body: { name: e.target.elements.name.value } });
          await refreshCore();
          renderKids();
        });
      });
    }

    const kidDialog = $('#kid-dialog');
    const kidForm = $('#kid-form');
    function paintKidPreview() {
      const k = state.editingKid || {};
      const preview = { ...k, name: kidForm.elements.name.value || '?', emoji: kidForm.elements.emoji.value, color: kidForm.elements.color.value };
      $('#kid-avatar-preview').innerHTML = avatarHtml(preview);
      $('#kid-photo-remove').hidden = !k.avatar_url;
      $('#kid-photo').closest('label').hidden = !k.id; // photo upload after first save
    }
    function openKid(kid, householdId) {
      state.editingKid = kid;
      $('#kid-dialog-title').textContent = kid ? `Edit ${kid.name}` : 'Add a kid';
      $('#kid-household').innerHTML = householdOptions(kid?.household_id || householdId);
      kidForm.elements.name.value = kid?.name || '';
      kidForm.elements.emoji.value = kid?.emoji || '';
      kidForm.elements.color.value = kid?.color || '#f5b82e';
      kidForm.elements.birth_year.value = kid?.birth_year || '';
      kidForm.elements.ui_mode.value = kid?.ui_mode || 'picture';
      kidForm.elements.active.checked = kid ? kid.active : true;
      $('#kid-apps').innerHTML = state.apps.map((a) => `
        <label class="row" style="gap:6px"><input type="checkbox" name="app_${esc(a.id)}"
          ${(kid ? kid.apps?.[a.id] : a.default_enabled) ? 'checked' : ''}> ${esc(a.icon)} ${esc(a.name)}</label>`).join('');
      paintKidPreview();
      kidDialog.showModal();
    }
    ['name', 'emoji', 'color'].forEach((n) => kidForm.elements[n].addEventListener('input', paintKidPreview));

    kidForm.addEventListener('submit', (e) => {
      if (e.submitter?.value !== 'save') return;
      e.preventDefault();
      const f = kidForm;
      const body = {
        name: f.elements.name.value,
        emoji: f.elements.emoji.value || null,
        color: f.elements.color.value,
        birth_year: f.elements.birth_year.value ? Number(f.elements.birth_year.value) : null,
        ui_mode: f.elements.ui_mode.value,
        household_id: f.elements.household_id.value,
        active: f.elements.active.checked,
      };
      const apps = Object.fromEntries(state.apps.map((a) => [a.id, f.elements[`app_${a.id}`].checked]));
      run(async () => {
        if (state.editingKid) {
          await adminApi(`/kids/${state.editingKid.id}`, { method: 'PATCH', body: { ...body, apps } });
        } else {
          const { kid } = await adminApi('/kids', { method: 'POST', body });
          await adminApi(`/kids/${kid.id}`, { method: 'PATCH', body: { apps } });
        }
        kidDialog.close();
        await refreshCore();
        render();
        toast('Saved');
      });
    });

    // Resize photos on the device so uploads stay small.
    async function resizeImage(file, max = 512) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const side = Math.round(Math.min(bitmap.width, bitmap.height) * scale);
      // Square centre crop for round avatars.
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = side;
      const srcSide = Math.min(bitmap.width, bitmap.height);
      canvas.getContext('2d').drawImage(bitmap,
        (bitmap.width - srcSide) / 2, (bitmap.height - srcSide) / 2, srcSide, srcSide, 0, 0, side, side);
      return new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.85));
    }
    $('#kid-photo').addEventListener('change', (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file || !state.editingKid) return;
      run(async () => {
        const blob = await resizeImage(file);
        const { kid } = await adminApi(`/kids/${state.editingKid.id}/avatar`, { method: 'POST', body: blob });
        state.editingKid = kid;
        paintKidPreview();
        await refreshCore();
        render();
      });
    });
    $('#kid-photo-remove').addEventListener('click', () => run(async () => {
      const { kid } = await adminApi(`/kids/${state.editingKid.id}/avatar`, { method: 'DELETE' });
      state.editingKid = kid;
      paintKidPreview();
      await refreshCore();
      render();
    }));

    // ---------- who sees it (toys & models) ----------
    function audienceLabel(aud) {
      if (!aud || (!aud.households.length && !aud.kids.length)) return 'Everyone';
      const names = [
        ...aud.households.map((h) => state.households.find((x) => x.id === h)?.name || 'family'),
        ...aud.kids.map((k) => state.kids.find((x) => x.id === k)?.name || 'kid'),
      ];
      return names.length > 2 ? `${names.slice(0, 2).join(', ')} +${names.length - 2}` : names.join(', ');
    }
    const audienceChip = (aud) => `<button type="button" class="chip aud-chip ${aud ? 'limited' : ''}" data-aud>👪 ${esc(audienceLabel(aud))}</button>`;

    /** Opens the picker; resolves after saving (or null on cancel). */
    function openAudience(type, id, title, aud) {
      const dlg = $('#aud-dialog');
      const form = $('#aud-form');
      const all = $('#aud-all');
      $('#aud-item').textContent = title;
      const selH = new Set(aud?.households || []);
      const selK = new Set(aud?.kids || []);
      all.checked = !selH.size && !selK.size;
      $('#aud-groups').innerHTML = state.households.map((h) => `
        <fieldset class="aud-group">
          <label class="row"><input type="checkbox" data-h="${esc(h.id)}" ${selH.has(h.id) ? 'checked' : ''}> <strong>${esc(h.name)}</strong> <span class="muted">whole family</span></label>
          <div class="row" style="padding-left:26px;gap:12px">
            ${state.kids.filter((k) => k.household_id === h.id && k.active).map((k) => `
              <label class="row" style="gap:6px"><input type="checkbox" data-k="${esc(k.id)}" ${selK.has(k.id) ? 'checked' : ''}> ${esc(k.name)}</label>`).join('') || '<span class="muted">No kids</span>'}
          </div>
        </fieldset>`).join('');
      const sync = () => {
        const any = form.querySelectorAll('[data-h]:checked, [data-k]:checked').length > 0;
        if (any) all.checked = false;
      };
      form.querySelectorAll('[data-h], [data-k]').forEach((cb) => cb.addEventListener('change', sync));
      all.onchange = () => { if (all.checked) form.querySelectorAll('[data-h], [data-k]').forEach((cb) => { cb.checked = false; }); };
      return new Promise((resolve) => {
        const onSubmit = (e) => {
          if (e.submitter?.value !== 'save') return;
          e.preventDefault();
          const households = [...form.querySelectorAll('[data-h]:checked')].map((x) => x.dataset.h);
          const kids = [...form.querySelectorAll('[data-k]:checked')].map((x) => x.dataset.k);
          if (!all.checked && !households.length && !kids.length) { toast('Pick at least one family or kid, or Everyone', true); return; }
          run(async () => {
            await adminApi('/audience', { method: 'PUT', body: { item_type: type, item_id: id, households, kids } });
            dlg.close();
            toast('Saved');
            resolve(true);
          });
        };
        form.addEventListener('submit', onSubmit);
        dlg.addEventListener('close', () => { form.removeEventListener('submit', onSubmit); resolve(null); }, { once: true });
        dlg.showModal();
      });
    }

    // ---------- catalog ----------
    const generating = new Map();   // toyId → 'stylized' | 'cutout' | 'coloring'
    const cutoutIssues = new Map(); // toyId → { reason, blob } when a cutout looked wrong
    let catalog = { toys: [], categories: [] };
    let catalogSearch = '';

    const categoryOptions = (selected) => catalog.categories
      .map((c) => `<option value="${esc(c.id)}" ${c.id === selected ? 'selected' : ''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('');
    const categoryIcon = (id) => catalog.categories.find((c) => c.id === id)?.icon || '🎁';

    // Shrink big phone photos before upload (keeps aspect ratio).
    async function shrinkPhoto(file, max = 1280) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.88));
    }

    async function loadCatalog() {
      catalog = await adminApi('/toys');
    }

    async function uploadCutout(toyId, blob) {
      await adminApi(`/toys/${toyId}/cutout`, { method: 'POST', body: blob });
      cutoutIssues.delete(toyId);
    }

    // Runs the picture steps in order. 'cutout' happens in this browser.
    async function makePictures(toyId, steps = ['stylized', 'cutout', 'coloring', 'trim-coloring']) {
      for (const step of steps) {
        generating.set(toyId, step);
        if (state.tab === 'catalog') renderCatalog(false);
        try {
          if (step === 'use-photo') {
            await adminApi(`/toys/${toyId}/use-photo`, { method: 'POST', body: {} });
          } else if (step === 'lineart') {
            await loadCatalog();
            const toy = catalog.toys.find((t) => t.id === toyId);
            const src = toy?.cutout || toy?.image;
            if (!src) throw new Error('Needs a picture first');
            await adminApi(`/toys/${toyId}/coloring`, { method: 'POST', body: await makeLineArt(src) });
          } else if (step === 'trim-coloring') {
            await loadCatalog();
            const toy = catalog.toys.find((t) => t.id === toyId);
            if (toy?.coloring) await adminApi(`/toys/${toyId}/coloring`, { method: 'POST', body: await trimToSquare(toy.coloring) });
          } else if (step === 'cutout') {
            await loadCatalog();
            const toy = catalog.toys.find((t) => t.id === toyId);
            if (!toy?.image) throw new Error('Make the storybook picture first');
            const result = await makeCutout(toy.image);
            if (result.ok) await uploadCutout(toyId, result.blob);
            else cutoutIssues.set(toyId, { reason: result.reason, blob: result.blob });
          } else {
            await adminApi(`/toys/${toyId}/generate`, { method: 'POST', body: { kind: step } });
          }
        } catch (err) {
          toast(err.message, true);
          break;
        } finally {
          generating.delete(toyId);
        }
      }
      await loadCatalog();
      if (state.tab === 'catalog') renderCatalog(false);
    }

    const STEP_LABEL = { stylized: 'Painting…', 'use-photo': 'Copying…', cutout: 'Cutting out…', coloring: 'Drawing…', lineart: 'Drawing…', 'trim-coloring': 'Trimming…' };
    // Gemini refuses some toys (well-known characters and brands): offer the product photo instead.
    const isBlocked = (msg) => /prohibited|blocked|safety|recitation|didn’t return an image/i.test(msg || '');
    const thumb = (src, label, { busy, checker, big } = {}) => `
      <button type="button" class="thumb ${checker ? 'checker' : ''}" ${src && !busy ? `data-zoom="${esc(src)}" data-label="${esc(label)}" data-checker="${checker ? 1 : 0}"` : 'disabled'}
        aria-label="${esc(label)}" title="${esc(label)}">
        ${busy ? `<span class="thumb-busy">${esc(busy)}</span>` : src ? `<img src="${esc(src)}" alt="" loading="lazy">` : '<span class="thumb-empty">—</span>'}
      </button>`;

    function cutoutStatus(t) {
      const issue = cutoutIssues.get(t.id);
      if (issue) return `<span class="warn">⚠ Cutout: ${esc(issue.reason)}</span>
        <button class="linkish" data-act="use-cutout">Use anyway</button>`;
      if (t.cutout) return '<span class="okay">✓ Cutout</span>';
      if (t.image) return '<span class="muted">No cutout yet</span>';
      return '';
    }

    function draftRow(t) {
      const busy = generating.get(t.id);
      return `
        <li class="toy-row" data-id="${esc(t.id)}">
          <div class="thumbs">
            ${thumb(t.source_image, 'Photo')}
            ${thumb(t.cutout || t.image, 'Storybook', { busy: ['stylized', 'use-photo', 'cutout'].includes(busy) && STEP_LABEL[busy], checker: !!t.cutout })}
            ${thumb(t.coloring, 'Coloring', { busy: ['coloring', 'lineart', 'trim-coloring'].includes(busy) && STEP_LABEL[busy] })}
          </div>
          <div class="toy-row-main">
            <div class="row" style="gap:6px">
              <input class="grow compact" data-field="title" value="${esc(t.title)}" maxlength="80" aria-label="Toy name">
              <select class="compact" data-field="category" aria-label="Category">${categoryOptions(t.category)}</select>
            </div>
            <div>${audienceChip(t.audience)}</div>
            <div class="toy-row-status">${t.gen_error
              ? (isBlocked(t.gen_error)
                ? `<span class="warn">⚠ Gemini won’t draw this one (characters and brands are often blocked).</span>
                   <button class="linkish" data-act="use-photo" ${busy ? 'disabled' : ''}>Use the product photo instead</button>`
                : `<span class="warn">⚠ ${esc(t.gen_error)}</span>`)
              : cutoutStatus(t)}</div>
            <div class="row toy-row-actions">
              <button class="btn small" data-act="redo-stylized" ${busy ? 'disabled' : ''}>${t.image ? 'Redo picture' : 'Make pictures'}</button>
              ${t.image ? `<button class="btn small" data-act="redo-cutout" ${busy ? 'disabled' : ''}>Redo cutout</button>` : ''}
              ${t.image ? `<button class="btn small" data-act="redo-coloring" ${busy ? 'disabled' : ''}>Redo coloring</button>` : ''}
              ${t.image ? `<button class="btn small" data-act="lineart" ${busy ? 'disabled' : ''} title="Make the coloring page here instead of with Gemini">Simple coloring</button>` : ''}
              <span style="flex:1"></span>
              <button class="btn small danger" data-act="delete">Delete</button>
              <button class="btn small primary" data-act="approve" ${t.image && t.coloring && !busy ? '' : 'disabled'}>Approve</button>
            </div>
          </div>
        </li>`;
    }

    function liveRow(t) {
      const busy = generating.get(t.id);
      return `
        <li class="toy-line" data-id="${esc(t.id)}">
          ${thumb(t.cutout || t.image, t.title, { busy: busy && STEP_LABEL[busy], checker: !!t.cutout })}
          <div class="main">
            <div class="toy-line-title">${esc(t.title)}</div>
            <div class="meta">${esc(categoryIcon(t.category))} ${t.cutout ? '' : '· no cutout'}${cutoutIssues.has(t.id) ? ' · ⚠ cutout needs a look' : ''}</div>
            <div style="margin-top:4px">${audienceChip(t.audience)}</div>
          </div>
          ${!t.cutout && !busy ? '<button class="btn small" data-act="redo-cutout">Cut out</button>' : ''}
          <button class="btn small" data-act="to-draft">Edit</button>
          <button class="btn small" data-act="hide">Hide</button>
        </li>`;
    }

    async function renderCatalog(fetch = true) {
      if (fetch) {
        main.innerHTML = '<p class="muted">Loading…</p>';
        try { await loadCatalog(); } catch (err) { main.innerHTML = `<p>${esc(err.message)}</p>`; return; }
      }
      const q = catalogSearch.trim().toLowerCase();
      const drafts = catalog.toys.filter((t) => t.status === 'draft');
      const live = catalog.toys.filter((t) => t.status === 'approved');
      const liveShown = live.filter((t) => !q || t.title.toLowerCase().includes(q));
      const hidden = catalog.toys.filter((t) => t.status === 'hidden');
      const searchHadFocus = document.activeElement?.id === 'toy-search';

      main.innerHTML = `
        <div class="card">
          <h2>Add a toy</h2>
          <form id="toy-link" class="row">
            <input class="grow" type="url" name="url" placeholder="Paste a product link" required>
            <select name="category" aria-label="Category">${categoryOptions('other')}</select>
            <button class="btn primary">Add</button>
          </form>
          <details style="margin-top:10px">
            <summary class="muted">Shop blocked the link? Add with a photo instead</summary>
            <form id="toy-photo" class="row" style="margin-top:8px">
              <input class="grow" name="title" placeholder="Toy name" maxlength="80" required>
              <select name="category" aria-label="Category">${categoryOptions('other')}</select>
              <label class="btn">Choose photo<input type="file" name="photo" accept="image/*" hidden></label>
            </form>
          </details>
        </div>

        ${drafts.length ? `
          <div class="card">
            <h2>Needs a look <span class="pill">${drafts.length}</span></h2>
            <ul class="list">${drafts.map(draftRow).join('')}</ul>

        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:8px">
            <h2 style="margin:0">In the catalog <span class="pill">${live.length}</span></h2>
            ${live.length ? `<button class="btn small" id="fit-all" title="Re-cut every toy and trim the white space off its coloring page">Fit all pictures</button>` : ''}
          </div>
          ${live.length > 6 ? `<input id="toy-search" class="compact" type="search" placeholder="Search toys" value="${esc(catalogSearch)}" style="width:100%;margin-bottom:6px">` : ''}
          ${live.length ? `<ul class="list">${liveShown.map(liveRow).join('') || '<li class="muted">No matches.</li>'}</ul>`
            : '<p class="muted" style="margin:0">Approved toys show up for the kids here.</p>'}
          ${hidden.length ? `
            <details style="margin-top:10px"><summary class="muted">Hidden (${hidden.length})</summary>
              <ul class="list">${hidden.map((t) => `
                <li class="toy-line" data-id="${esc(t.id)}">${thumb(t.cutout || t.image, t.title, { checker: !!t.cutout })}
                  <div class="main toy-line-title">${esc(t.title)}</div>
                  <button class="btn small" data-act="show">Show</button>
                  <button class="btn small danger" data-act="delete">Delete</button></li>`).join('')}
              </ul>
            </details>` : ''}
        </div>`;

      const search = $('#toy-search');
      if (search) {
        if (searchHadFocus) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); }
        search.addEventListener('input', () => { catalogSearch = search.value; renderCatalog(false); });
      }

      $('#toy-link').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target.elements;
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Reading…';
        run(async () => {
          try {
            const { toy } = await adminApi('/toys/import', { method: 'POST', body: { url: f.url.value, category: f.category.value } });
            await loadCatalog();
            makePictures(toy.id);
          } finally { btn.disabled = false; btn.textContent = 'Add'; }
        });
      });

      $('#toy-photo').elements.photo.addEventListener('change', (e) => {
        const f = $('#toy-photo').elements;
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!f.title.value.trim()) { toast('Type the toy’s name first', true); return; }
        run(async () => {
          const blob = await shrinkPhoto(file);
          const q2 = new URLSearchParams({ title: f.title.value.trim(), category: f.category.value });
          const { toy } = await adminApi(`/toys?${q2}`, { method: 'POST', body: blob });
          await loadCatalog();
          makePictures(toy.id);
        });
      });

      $('#fit-all')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const toys = catalog.toys.filter((t) => t.status !== 'hidden' && t.image && !generating.has(t.id));
        let n = 0;
        for (const t of toys) {
          n++;
          const b = $('#fit-all');
          if (b) { b.disabled = true; b.textContent = `Fitting ${n} of ${toys.length}…`; }
          await makePictures(t.id, ['cutout', 'trim-coloring']);
        }
        toast(`Fitted ${toys.length} toy${toys.length === 1 ? '' : 's'}`);
        renderCatalog(false);
      });

      const toyOf = (el) => el.closest('[data-id]').dataset.id;
      const patch = (id, body) => run(async () => {
        await adminApi(`/toys/${id}`, { method: 'PATCH', body });
        await loadCatalog();
        renderCatalog(false);
      });

      main.querySelectorAll('[data-field]').forEach((el) => el.addEventListener('change', () => {
        const id = toyOf(el);
        run(async () => {
          await adminApi(`/toys/${id}`, { method: 'PATCH', body: { [el.dataset.field]: el.value } });
          await loadCatalog();
          toast('Saved');
        });
      }));

      main.querySelectorAll('[data-aud]').forEach((b) => b.addEventListener('click', async () => {
        const id = toyOf(b);
        const t = catalog.toys.find((x) => x.id === id);
        if (await openAudience('toy', id, t.title, t.audience)) { await loadCatalog(); renderCatalog(false); }
      }));

      main.querySelectorAll('[data-zoom]').forEach((b) => b.addEventListener('click', () => {
        $('#zoom-img').src = b.dataset.zoom;
        $('#zoom-img').parentElement.classList.toggle('checker', b.dataset.checker === '1');
        $('#zoom-label').textContent = b.dataset.label;
        $('#zoom').showModal();
      }));

      main.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
        const id = toyOf(b);
        const act = b.dataset.act;
        if (act === 'redo-stylized') makePictures(id);
        if (act === 'redo-cutout') makePictures(id, ['cutout']);
        if (act === 'redo-coloring') makePictures(id, ['coloring', 'trim-coloring']);
        if (act === 'use-photo') makePictures(id, ['use-photo', 'cutout', 'lineart']);
        if (act === 'lineart') makePictures(id, ['lineart']);
        if (act === 'use-cutout') run(async () => {
          await uploadCutout(id, cutoutIssues.get(id).blob);
          await loadCatalog();
          renderCatalog(false);
        });
        if (act === 'approve') patch(id, { status: 'approved' });
        if (act === 'hide') patch(id, { status: 'hidden' });
        if (act === 'show') patch(id, { status: 'approved' });
        if (act === 'to-draft') patch(id, { status: 'draft' });
        if (act === 'delete') {
          if (!confirm('Delete this toy and its pictures? It also comes off any wish lists.')) return;
          run(async () => { await adminApi(`/toys/${id}`, { method: 'DELETE' }); await loadCatalog(); renderCatalog(false); });
        }
      }));
    }

    // ---------- shopping ----------
    let shoppingFilter = 'todo';
    async function renderShopping() {
      main.innerHTML = '<p class="muted">Loading…</p>';
      let data;
      try { data = await adminApi('/shopping'); } catch (err) { main.innerHTML = `<p>${esc(err.message)}</p>`; return; }
      const { kids, totals } = data;
      const show = (i) => shoppingFilter === 'all' || (!i.bought && !i.removed);
      const left = totals.wishes - kids.flatMap((k) => k.items).filter((i) => i.bought && !i.removed).length;

      main.innerHTML = `
        <div class="card">
          <div class="row" style="justify-content:space-between">
            <h2 style="margin:0">Shopping list</h2>
            <div class="chips">
              <button class="chip" type="button" data-filter="todo" aria-pressed="${shoppingFilter === 'todo'}" style="padding:4px 12px">Still to buy</button>
              <button class="chip" type="button" data-filter="all" aria-pressed="${shoppingFilter === 'all'}" style="padding:4px 12px">Everything</button>
            </div>
          </div>
          <p class="muted" style="margin:8px 0 0">${totals.wishes} wish${totals.wishes === 1 ? '' : 'es'} · ${totals.bought} bought · ${Math.max(0, left)} to go. Kids never see what’s been bought.</p>
        </div>
        ${kids.length ? kids.map((k) => {
          const items = k.items.filter(show);
          return `
          <div class="card">
            <div class="row shop-kid" style="margin-bottom:6px">
              ${avatarHtml({ name: k.kid_name, emoji: k.emoji, color: k.color, avatar_url: k.avatar_url })}
              <div class="main"><h2 style="margin:0">${esc(k.kid_name)}</h2><div class="muted" style="font-size:0.85rem">${esc(k.household_name)}</div></div>
            </div>
            <ul class="list shop-list">
              ${items.length ? items.map((i) => `
                <li data-kid="${esc(k.kid_id)}" data-toy="${esc(i.toy_id)}" class="${i.bought ? 'is-bought' : ''}">
                  ${i.image ? `<img class="shop-thumb" src="${esc(i.image)}" alt="">` : '<span class="shop-thumb"></span>'}
                  <div class="main">
                    <div><strong>${esc(i.title)}</strong>
                      ${i.removed ? '<span class="pill off">taken off list</span>' : ''}</div>
                    <div class="meta">${i.bought ? `Bought by ${esc(i.bought_by)} · ${esc(when(i.bought_at))}` : `Wished ${esc(when(i.added_at))}`}</div>
                    <div class="row" style="gap:6px;margin-top:6px">
                      ${i.source_url
                        ? `<a class="btn small" href="${esc(i.source_url)}" target="_blank" rel="noopener">Buy ↗</a>`
                        : `<button class="btn small" type="button" data-addlink>Add shop link</button>`}
                      <button class="btn small ${i.bought ? '' : 'primary'}" type="button" data-bought="${i.bought ? '0' : '1'}">
                        ${i.bought ? 'Undo bought' : '✓ Mark bought'}</button>
                    </div>
                    <form class="row" data-linkform hidden style="margin-top:6px;gap:6px">
                      <input class="grow" type="url" placeholder="https://…" required>
                      <button class="btn small primary">Save</button>
                    </form>
                  </div>
                </li>`).join('') : `<li class="muted">${k.items.length ? 'All bought! 🎉' : 'No wishes yet.'}</li>`}
            </ul>
          </div>`;
        }).join('') : '<div class="card"><p class="muted" style="margin:0">No wishes yet. They appear here as the kids tap hearts in Santa’s Catalog.</p></div>'}`;

      main.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
        shoppingFilter = b.dataset.filter;
        renderShopping();
      }));
      main.querySelectorAll('[data-bought]').forEach((b) => b.addEventListener('click', () => {
        const li = b.closest('li');
        run(async () => {
          await adminApi('/shopping/bought', { method: 'POST', body: {
            kid_id: li.dataset.kid, toy_id: li.dataset.toy, bought: b.dataset.bought === '1' } });
          toast(b.dataset.bought === '1' ? 'Marked as bought' : 'Back on the list');
          renderShopping();
        });
      }));
      main.querySelectorAll('[data-addlink]').forEach((b) => b.addEventListener('click', () => {
        const form = b.closest('li').querySelector('[data-linkform]');
        form.hidden = false;
        form.querySelector('input').focus();
      }));
      main.querySelectorAll('[data-linkform]').forEach((f) => f.addEventListener('submit', (e) => {
        e.preventDefault();
        const li = f.closest('li');
        run(async () => {
          await adminApi(`/toys/${li.dataset.toy}`, { method: 'PATCH', body: { source_url: f.querySelector('input').value } });
          toast('Link saved');
          renderShopping();
        });
      }));
    }

    // ---------- print shop ----------
    let printTab = 'queue';
    let ps = { models: [], filaments: [], requests: [], showAll: false };
    const STATUS_LABEL = { requested: '🕐 Waiting', printing: '🖨️ Printing', done: '✅ Done', refunded: '↩️ Refunded' };

    async function loadPrintShop() {
      const [m, f, r] = await Promise.all([
        adminApi('/models'), adminApi('/filaments'), adminApi(`/print-requests?status=${ps.showAll ? 'all' : 'open'}`),
      ]);
      ps = { ...ps, models: m.models, filaments: f.filaments, requests: r.requests };
    }

    async function renderPrintShop(fetch = true) {
      if (fetch) {
        main.innerHTML = '<p class="muted">Loading…</p>';
        try { await loadPrintShop(); } catch (err) { main.innerHTML = `<p>${esc(err.message)}</p>`; return; }
      }
      const open = ps.requests.filter((r) => r.status === 'requested' || r.status === 'printing').length;
      main.innerHTML = `
        <div class="seg" role="tablist">
          <button data-ptab="queue" aria-selected="${printTab === 'queue'}">Queue ${open ? `<span class="pill">${open}</span>` : ''}</button>
          <button data-ptab="models" aria-selected="${printTab === 'models'}">Models <span class="muted">${ps.models.length}</span></button>

      main.querySelectorAll('[data-ptab]').forEach((b) => b.addEventListener('click', () => { printTab = b.dataset.ptab; renderPrintShop(false); }));
      ({ queue: renderQueue, models: renderModels, filaments: renderFilaments })[printTab]($('#ps-body'));
    }

    // Queue -----------------------------------------------------------------
    function renderQueue(box) {
      const reqs = ps.requests;
      box.innerHTML = `
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:6px">
            <h2 style="margin:0">${ps.showAll ? 'All requests' : 'To print'}</h2>
            <button class="btn small" id="q-toggle">${ps.showAll ? 'Show open only' : 'Show history'}</button>
          </div>
          <ul class="list">
            ${reqs.length ? reqs.map((r) => `
              <li class="req" data-id="${esc(r.id)}">
                ${r.thumb ? `<img class="shop-thumb checker" src="${esc(r.thumb)}" alt="">` : '<span class="shop-thumb"></span>'}
                <div class="main">
                  <div><strong>${esc(r.model_title)}</strong> for <strong>${esc(r.kid_name)}</strong> <span class="muted">· ${esc(r.household_name)}</span></div>
                  <div class="req-colors">${r.colors.map((c) => `<span><i class="sw" style="background:${esc(swatchBackground(c))}"></i>${esc(c.slot)}: ${esc(c.name)}${c.finish && c.finish !== 'solid' ? ` <span class="muted">${esc(finishOf(c.finish).label.toLowerCase())}</span>` : ''} <span class="muted">(E${c.extruder})</span></span>`).join('')}</div>
                  <div class="meta">⭐ ${r.cost} · ${r.multi ? 'multi-color' : 'single color'} · ${esc(when(r.created_at))} · ${STATUS_LABEL[r.status]}${r.refund_reason ? ` (${esc(r.refund_reason)})` : ''}</div>
                  <div class="row" style="gap:6px;margin-top:6px">
                    <a class="btn small" href="/api/admin/models/${esc(r.model_id)}/file">Download .3mf</a>
                    ${r.status === 'requested' ? '<button class="btn small" data-rs="printing">Start printing</button>' : ''}
                    ${r.status === 'requested' || r.status === 'printing' ? '<button class="btn small primary" data-rs="done">Done</button>' : ''}
                    ${r.status !== 'refunded' ? '<button class="btn small danger" data-rs="refunded">Refund</button>' : ''}
                  </div>
                </div>
              </li>`).join('') : `<li class="muted">${ps.showAll ? 'No requests yet.' : 'Nothing to print. 🎉'}</li>`}
          </ul>
        </div>`;
      $('#q-toggle').addEventListener('click', () => { ps.showAll = !ps.showAll; renderPrintShop(); });
      box.querySelectorAll('[data-rs]').forEach((b) => b.addEventListener('click', () => {
        const id = b.closest('[data-id]').dataset.id;
        const status = b.dataset.rs;
        let reason;
        if (status === 'refunded') {
          reason = prompt('Why are you refunding it? (shown to grown-ups only)', 'Couldn’t print it');
          if (reason === null) return;
        }
        run(async () => {
          await adminApi(`/print-requests/${id}`, { method: 'PATCH', body: { status, reason } });
          toast(status === 'refunded' ? 'Stars given back' : status === 'done' ? 'Marked done' : 'Printing');
          renderPrintShop();
        });
      }));
    }

    // Filaments ---------------------------------------------------------------
    const finishOptions = (sel) => FINISHES.map((x) => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.label)}</option>`).join('');
    function renderFilaments(box) {
      box.innerHTML = `
        <div class="card">
          <h2>Add a filament</h2>
          <form id="fil-form" class="fil-form">
            <span class="fil-sw" id="fil-preview" aria-hidden="true"></span>
            <input type="color" name="hex" value="#FFD84A" aria-label="Color">
            <input class="grow" name="name" placeholder="Name, e.g. White Marble" maxlength="40" required>
            <select name="finish" aria-label="Finish">${finishOptions('solid')}</select>
            <label class="fil-two" title=""><input type="color" name="hex2" value="#555555" aria-label="Second color"><span></span></label>
            <input name="material" placeholder="PLA" maxlength="20" style="width:70px">
            <button class="btn primary">Add</button>
          </form>
          <p class="muted" style="margin:8px 0 0;font-size:0.85rem">Patterns are drawn on the 3D preview so kids can see roughly what they’ll get.</p>
        </div>
        <div class="card">
          <h2>Your spools</h2>
          <p class="muted" style="margin:0 0 8px">Kids only see colors marked in stock.</p>
          <ul class="list">
            ${ps.filaments.map((f) => {
              const fin = finishOf(f.finish);
              return `
              <li data-id="${esc(f.id)}">
                <span class="fil-sw" style="background:${esc(swatchBackground(f))}" aria-hidden="true"></span>
                <input type="color" value="${esc(f.hex)}" data-ff="hex" aria-label="Color of ${esc(f.name)}">
                ${fin.second ? `<input type="color" value="${esc(secondColor(f))}" data-ff="hex2" title="${esc(fin.second)}" aria-label="${esc(fin.second)}">` : ''}
                <div class="main"><input class="compact" value="${esc(f.name)}" data-ff="name" maxlength="40" style="width:100%"></div>
                <select data-ff="finish" class="compact" aria-label="Finish of ${esc(f.name)}">${finishOptions(f.finish)}</select>
                <span class="muted" style="font-size:0.8rem">${esc(f.material)}</span>
                <button class="chip ${f.in_stock ? '' : 'off'}" data-stock aria-pressed="${f.in_stock}" style="padding:3px 10px">${f.in_stock ? 'In stock' : 'Out'}</button>
                <button class="btn small danger" data-del aria-label="Delete ${esc(f.name)}">✕</button>
              </li>`;
            }).join('') || '<li class="muted">No filaments yet.</li>'}
          </ul>
        </div>`;
      const form = $('#fil-form');
      const sync = () => {
        const el = form.elements; const fin = finishOf(el.finish.value);
        const two = form.querySelector('.fil-two');
        two.hidden = !fin.second;
        two.title = fin.second || '';
        two.querySelector('span').textContent = fin.second ? fin.second.replace(/ \(optional\)/, '') : '';
        $('#fil-preview').style.background = swatchBackground({ hex: el.hex.value, hex2: fin.second ? el.hex2.value : null, finish: el.finish.value });
      };
      form.elements.finish.addEventListener('change', () => {
        // Start the second color somewhere sensible for the chosen finish.
        const el = form.elements;
        if (finishOf(el.finish.value).second) el.hex2.value = el.finish.value === 'silk' ? el.hex.value : secondColor({ hex: el.hex.value, finish: el.finish.value });
        sync();
      });
      form.addEventListener('input', sync);
      sync();
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target.elements;
        const fin = finishOf(f.finish.value);
        const hex2 = fin.second && !(fin.id === 'silk' && f.hex2.value.toLowerCase() === f.hex.value.toLowerCase()) ? f.hex2.value : null;
        run(async () => {
          await adminApi('/filaments', { method: 'POST', body: { name: f.name.value, hex: f.hex.value, finish: f.finish.value, hex2, material: f.material.value || 'PLA' } });
          await loadPrintShop(); renderPrintShop(false);
        });
      });
      box.querySelectorAll('[data-ff]').forEach((el) => el.addEventListener('change', () => run(async () => {
        await adminApi(`/filaments/${el.closest('[data-id]').dataset.id}`, { method: 'PATCH', body: { [el.dataset.ff]: el.value } });
        await loadPrintShop();
        if (el.dataset.ff === 'finish' || el.dataset.ff.startsWith('hex')) renderPrintShop(false);
        toast('Saved');
      })));
      box.querySelectorAll('[data-stock]').forEach((b) => b.addEventListener('click', () => run(async () => {
        await adminApi(`/filaments/${b.closest('[data-id]').dataset.id}`, { method: 'PATCH', body: { in_stock: b.getAttribute('aria-pressed') !== 'true' } });
        await loadPrintShop(); renderPrintShop(false);
      })));
      box.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
        if (!confirm('Delete this filament? Past requests keep their colors.')) return;
        run(async () => { await adminApi(`/filaments/${b.closest('[data-id]').dataset.id}`, { method: 'DELETE' }); await loadPrintShop(); renderPrintShop(false); });
      }));
    }

    // Models --------------------------------------------------------------------
    const intake = new Map(); // model id or 'new' → status text

    async function processModelFile(file) {
      const tmp = `new-${Date.now()}`;
      const say = (t) => { intake.set(tmp, t); if (state.tab === 'print' && printTab === 'models') renderPrintShop(false); };
      try {
        say(`Reading ${file.name}…`);
        const { parseProject, slotsFrom, sizeOf, buildPreview } = await import('/shared/threemf.js');
        const proj = await parseProject(await file.arrayBuffer());
        const slots = slotsFrom(proj);
        if (slots.length > 5) throw new Error('More than 5 colors — the MMU3 has 5');
        const size = sizeOf(proj);
        say('Making the tablet version…');
        const preview = await buildPreview(proj);
        say(`Uploading ${(file.size / 1048576).toFixed(1)} MB…`);
        const { model } = await adminApi(`/models?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: new Blob([file], { type: 'model/3mf' }) });
        await adminApi(`/models/${model.id}/asset?kind=preview`, { method: 'POST', body: new Blob([preview.bytes], { type: 'application/octet-stream' }) });
        say('Taking its picture…');
        const thumb = await renderThumb(preview.bytes.buffer, Object.fromEntries(slots.map((s) => [s.extruder, s.hex])));
        await adminApi(`/models/${model.id}/asset?kind=thumb`, { method: 'POST', body: thumb });
        await adminApi(`/models/${model.id}`, { method: 'PATCH', body: { slots, size_mm: size, ...(proj.title ? { title: proj.title.replace(/[-_]+/g, ' ').replace(/\s+v?\d+(\.\d+)*$/i, '').slice(0, 60) } : {}) } });
        intake.delete(tmp);
        toast(`${file.name} added — name the colors and set prices`);
      } catch (err) {
        intake.delete(tmp);
        toast(err.message, true);
      }
      await loadPrintShop();
      if (state.tab === 'print') renderPrintShop(false);
    }

    // Recolor the shop picture when a slot's preview color changes.
    async function retakeThumb(m, slots) {
      try {
        const buf = await (await fetch(m.preview)).arrayBuffer();
        const thumb = await renderThumb(buf, Object.fromEntries(slots.map((s) => [s.extruder, s.hex])));
        await adminApi(`/models/${m.id}/asset?kind=thumb`, { method: 'POST', body: thumb });
        await loadPrintShop();
        if (state.tab === 'print' && printTab === 'models') renderPrintShop(false);
      } catch (err) { toast(err.message, true); }
    }

    async function renderThumb(buffer, colors) {
      const { ModelViewer } = await import('/shared/model-viewer.js');
      const c = document.createElement('canvas');
      c.width = c.height = 640;
      const v = new ModelViewer(c, { autoRotate: false });
      await v.load(buffer);
      v.setColors(colors);
      const blob = await v.snapshot('image/webp', 0.9);
      v.destroy();
      return blob;
    }

    let viewer3d = null;
    async function openModelViewer(m) {
      const dlg = $('#model-dialog');
      $('#model-dialog-title').textContent = m.title;
      dlg.showModal();
      const { ModelViewer } = await import('/shared/model-viewer.js');
      viewer3d?.destroy();
      viewer3d = new ModelViewer($('#model-canvas'));
      await viewer3d.load(m.preview);
      viewer3d.setColors(Object.fromEntries(m.slots.map((s) => [s.extruder, s.hex])));
    }

    function modelRow(m) {
      const used = m.requests ? ` · ${m.requests} request${m.requests > 1 ? 's' : ''}` : '';
      return `
        <li class="model-row" data-id="${esc(m.id)}">
          <button type="button" class="thumb checker" data-view ${m.preview ? '' : 'disabled'} aria-label="Spin ${esc(m.title)}" style="width:84px;height:84px">
            ${m.thumb ? `<img src="${esc(m.thumb)}" alt="">` : '<span class="thumb-busy">…</span>'}</button>
          <div class="toy-row-main">
            <div class="row" style="gap:6px">
              <input class="grow compact" data-mf="title" value="${esc(m.title)}" maxlength="60" aria-label="Name">
              ${m.status === 'approved' ? '<span class="pill">in shop</span>' : m.status === 'hidden' ? '<span class="pill off">hidden</span>' : '<span class="pill" style="background:#fff3cf;color:#7a5200">draft</span>'}
            </div>
            <input class="compact" data-mf="source_url" value="${esc(m.source_url || '')}" placeholder="Link (Printables, MakerWorld…)" type="url">
            <div class="slots">
              ${m.slots.map((s) => `
                <label class="slot-ed" title="Extruder ${s.extruder}${s.share != null ? ` · ${Math.round(s.share * 100)}% of surface` : ''}">
                  <input type="color" value="${esc(s.hex)}" data-slot-hex="${s.extruder}" aria-label="Preview color for extruder ${s.extruder}">
                  <span class="muted">E${s.extruder}</span>
                  <input class="compact" value="${esc(s.name)}" data-slot-name="${s.extruder}" maxlength="30" aria-label="Name for extruder ${s.extruder}">
                </label>`).join('')}
            </div>
            <div class="row" style="gap:10px">
              <label class="row" style="gap:6px">⭐ One color <input class="compact" type="number" min="0" max="999" data-mf="price_single" value="${m.price_single}" style="width:64px"></label>
              <label class="row" style="gap:6px">⭐ Mixed <input class="compact" type="number" min="0" max="999" data-mf="price_multi" value="${m.price_multi}" style="width:64px"></label>
              ${audienceChip(m.audience)}
            </div>
            <div class="meta">${m.size_mm ? `${m.size_mm.join(' × ')} mm` : ''}${used}${m.file_name ? ` · ${esc(m.file_name)}` : ''}</div>
            <div class="row" style="gap:6px">
              <a class="btn small" href="/api/admin/models/${esc(m.id)}/file">Download .3mf</a>
              <span style="flex:1"></span>
              ${m.status === 'approved' ? '<button class="btn small" data-ms="hidden">Hide</button>' : ''}
              ${m.status === 'hidden' ? '<button class="btn small" data-ms="approved">Show</button>' : ''}
              ${!m.requests ? '<button class="btn small danger" data-mdel>Delete</button>' : ''}
              ${m.status === 'draft' ? `<button class="btn small primary" data-ms="approved" ${m.preview && m.thumb ? '' : 'disabled'}>Put in shop</button>` : ''}
            </div>
          </div>
        </li>`;
    }

    function renderModels(box) {
      const noStock = !ps.filaments.some((f) => f.in_stock);
      box.innerHTML = `
        ${noStock ? `<div class="card" style="border-color:#f0b429;background:#fff8e6"><strong>Add some filaments first.</strong> Kids pick colors from the in-stock filaments, so until there are some they can’t choose colors or spend stars. <button class="btn small" data-goto-fil>Go to Filaments</button></div>` : ''}
        <div class="card">
          <h2>Add a model</h2>
          <p class="muted" style="margin:0 0 10px">Set it up in PrusaSlicer (colors on extruders 1–5), then <strong>File → Save Project As</strong> and upload the .3mf here. Use a computer — it does the heavy lifting once so tablets don’t have to.</p>
          <label class="btn primary">Choose .3mf project<input type="file" id="model-file" accept=".3mf" multiple hidden></label>
          ${[...intake.values()].map((t) => `<p class="muted thumb-busy" style="margin:10px 0 0;font-size:0.9rem">${esc(t)}</p>`).join('')}
        </div>
        <div class="card">
          <h2>Models</h2>
          <ul class="list">${ps.models.map(modelRow).join('') || '<li class="muted">No models yet.</li>'}</ul>
        </div>`;

      box.querySelector('[data-goto-fil]')?.addEventListener('click', () => { printTab = 'filaments'; renderPrintShop(false); });
      $('#model-file').addEventListener('change', async (e) => {
        const files = [...e.target.files];
        e.target.value = '';
        for (const f of files) await processModelFile(f);
      });
      const modelOf = (el) => ps.models.find((x) => x.id === el.closest('[data-id]').dataset.id);
      const patchModel = (m, body, quiet) => run(async () => {
        await adminApi(`/models/${m.id}`, { method: 'PATCH', body });
        await loadPrintShop();
        if (!quiet) renderPrintShop(false); else toast('Saved');
      });
      box.querySelectorAll('[data-mf]').forEach((el) => el.addEventListener('change', () => {
        const v = el.type === 'number' ? Number(el.value) : el.value;
        patchModel(modelOf(el), { [el.dataset.mf]: v }, true);
      }));
      const saveSlots = (el) => {
        const m = modelOf(el);
        const li = el.closest('[data-id]');
        const slots = m.slots.map((s) => ({
          ...s,
          name: li.querySelector(`[data-slot-name="${s.extruder}"]`).value.trim() || s.name,
          hex: li.querySelector(`[data-slot-hex="${s.extruder}"]`).value,
        }));
        patchModel(m, { slots }, true);
        if (el.dataset.slotHex && m.preview) retakeThumb(m, slots);
      };
      box.querySelectorAll('[data-slot-name], [data-slot-hex]').forEach((el) => el.addEventListener('change', () => saveSlots(el)));
      box.querySelectorAll('[data-ms]').forEach((b) => b.addEventListener('click', () => patchModel(modelOf(b), { status: b.dataset.ms })));
      box.querySelectorAll('[data-mdel]').forEach((b) => b.addEventListener('click', () => {
        const m = modelOf(b);
        if (!confirm(`Delete ${m.title}?`)) return;
        run(async () => { await adminApi(`/models/${m.id}`, { method: 'DELETE' }); await loadPrintShop(); renderPrintShop(false); });
      }));
      box.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => openModelViewer(modelOf(b))));
      box.querySelectorAll('[data-aud]').forEach((b) => b.addEventListener('click', async () => {
        const m = modelOf(b);
        if (await openAudience('model', m.id, m.title, m.audience)) { await loadPrintShop(); renderPrintShop(false); }
      }));
    }

    // ---------- tablets ----------
    let countdown;
    async function renderTablets() {
      clearInterval(countdown);
      main.innerHTML = `
        <div class="card">
          <h2>Set up a tablet</h2>
          <form id="pair-form" style="display:grid;gap:10px">
            <div class="row">
              <label class="field grow">Household<select name="household_id">${householdOptions(defaultHousehold())}</select></label>
              <label class="field grow">Tablet name<input name="device_name" placeholder="Playroom iPad" required maxlength="40"></label>
            </div>
            <label class="field">Who uses it?<select name="kid_id" id="pair-kid"></select></label>
            <div><button class="btn primary">Get a code</button></div>
          </form>
          <div id="code-out"></div>
        </div>
        <div class="card"><h2>Paired tablets</h2><ul class="list" id="devices"><li class="muted">Loading…</li></ul></div>`;

      // "Everyone" or one kid from the chosen household.
      const kidOptions = (householdId, selected) => `<option value="">Everyone in the household</option>` +
        state.kids.filter((k) => k.household_id === householdId && k.active)
          .map((k) => `<option value="${esc(k.id)}" ${k.id === selected ? 'selected' : ''}>Only ${esc(k.name)}</option>`).join('');
      const pairForm = $('#pair-form');
      const paintPairKids = () => { $('#pair-kid').innerHTML = kidOptions(pairForm.elements.household_id.value, ''); };
      pairForm.elements.household_id.addEventListener('change', paintPairKids);
      paintPairKids();

      pairForm.addEventListener('submit', (e) => {
        e.preventDefault();
        run(async () => {
          const r = await adminApi('/pairing-codes', { method: 'POST', body: {
            household_id: e.target.elements.household_id.value, device_name: e.target.elements.device_name.value,
            kid_id: e.target.elements.kid_id.value || null } });
          const out = $('#code-out');
          const expires = Date.parse(r.expires_at);
          out.innerHTML = `
            <div class="code-display">${esc(r.code)}</div>
            <p class="muted" style="text-align:center">On the tablet, open <strong>${esc(location.host)}/pair</strong> and enter this code.
              <span id="code-ttl"></span></p>`;
          clearInterval(countdown);
          const tick = () => {
            const s = Math.max(0, Math.round((expires - Date.now()) / 1000));
            const ttl = $('#code-ttl');
            if (!ttl) return clearInterval(countdown);
            ttl.textContent = s ? `Expires in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}.` : 'Expired.';
            if (!s) clearInterval(countdown);
          };
          tick();
          countdown = setInterval(tick, 1000);
        });
      });

      const { devices } = await run(() => adminApi('/devices'));
      $('#devices').innerHTML = devices.length ? devices.map((d) => `
        <li>
          <div class="main">
            <div><strong>${esc(d.name)}</strong> · ${esc(d.household_name)}
              ${d.revoked_at ? '<span class="pill off">removed</span>' : d.kid_name ? `<span class="pill">🔒 ${esc(d.kid_name)}</span>` : '<span class="pill">Shared</span>'}</div>
            <div class="meta">Paired ${esc(when(d.created_at))} by ${esc(d.created_by)} · last seen ${esc(when(d.last_seen))}</div>
            ${d.revoked_at ? '' : `<select class="btn small" data-lock="${esc(d.id)}" aria-label="Who uses ${esc(d.name)}" style="margin-top:6px;max-width:100%">${kidOptions(d.household_id, d.kid_id)}</select>`}
          </div>
          ${d.revoked_at ? '' : `<button class="btn small danger" data-revoke="${esc(d.id)}">Remove</button>`}
        </li>`).join('') : '<li class="muted">No tablets yet.</li>';
      main.querySelectorAll('[data-lock]').forEach((sel) => sel.addEventListener('change', () => run(async () => {
        await adminApi(`/devices/${sel.dataset.lock}`, { method: 'PATCH', body: { kid_id: sel.value || null } });
        toast(sel.value ? `Locked to ${sel.selectedOptions[0].textContent.replace('Only ', '')}` : 'Shared with the household');
        renderTablets();
      })));
      main.querySelectorAll('[data-revoke]').forEach((b) => b.addEventListener('click', () => {
        if (!confirm('Remove this tablet? It will need a new code to work again.')) return;
        run(async () => { await adminApi(`/devices/${b.dataset.revoke}`, { method: 'DELETE' }); renderTablets(); });
      }));
    }

    // ---------- grown-ups & keys ----------
    async function renderGrownups() {
      const [{ adults }, keys] = await Promise.all([
        run(() => adminApi('/adults')),
        isOwner() ? run(() => adminApi('/api-keys')) : Promise.resolve({ api_keys: [] }),
      ]);
      main.innerHTML = `
        <div class="card">
          <h2>Grown-ups</h2>
          <p class="muted">Anyone here can give tokens and set up tablets. They also need to be allowed in the Cloudflare Access policy.</p>
          <ul class="list">
            ${adults.map((a) => `
              <li>
                <div class="main">
                  <div><strong>${esc(a.name || a.email)}</strong> ${a.role === 'owner' ? '<span class="pill">owner</span>' : ''}</div>
                  <div class="meta">${esc(a.email)}${a.household_name ? ' · ' + esc(a.household_name) : ''}</div>
                </div>
                ${isOwner() && a.role !== 'owner' ? `<button class="btn small danger" data-remove="${esc(a.email)}">Remove</button>` : ''}
              </li>`).join('')}
          </ul>
          ${isOwner() ? `
            <form id="adult-form" class="row" style="margin-top:12px">
              <input class="grow" name="email" type="email" placeholder="email@example.com" required>
              <input class="grow" name="name" placeholder="Name">
              <select name="household_id">${householdOptions(null)}</select>
              <button class="btn primary">Add</button>
            </form>` : ''}
        </div>
        ${isOwner() ? `
          <div class="card">
            <h2>Integration keys</h2>
            <p class="muted">For Home Assistant chores later: <code>POST /api/hook/award</code> with header <code>X-Api-Key</code>.</p>
            <ul class="list">
              ${keys.api_keys.map((k) => `
                <li>
                  <div class="main">
                    <div><strong>${esc(k.name)}</strong> <span class="pill">${esc(k.scopes)}</span> ${k.revoked_at ? '<span class="pill off">revoked</span>' : ''}</div>
                    <div class="meta">Created ${esc(when(k.created_at))}</div>
                  </div>
                  ${k.revoked_at ? '' : `<button class="btn small danger" data-revoke-key="${esc(k.id)}">Revoke</button>`}
                </li>`).join('') || '<li class="muted">No keys yet.</li>'}
            </ul>
            <form id="key-form" class="row" style="margin-top:12px">
              <input class="grow" name="name" placeholder="Home Assistant" required maxlength="40">
              <button class="btn">Create key</button>
            </form>
            <div id="key-out"></div>
          </div>` : ''}`;

      main.querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', () => {
        if (!confirm(`Remove ${b.dataset.remove}?`)) return;
        run(async () => { await adminApi(`/adults/${encodeURIComponent(b.dataset.remove)}`, { method: 'DELETE' }); renderGrownups(); });
      }));
      main.querySelectorAll('[data-revoke-key]').forEach((b) => b.addEventListener('click', () => {
        if (!confirm('Revoke this key? Anything using it will stop working.')) return;
        run(async () => { await adminApi(`/api-keys/${b.dataset.revokeKey}`, { method: 'DELETE' }); renderGrownups(); });
      }));
      $('#adult-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target;
        run(async () => {
          await adminApi('/adults', { method: 'POST', body: { email: f.elements.email.value, name: f.elements.name.value || null, household_id: f.elements.household_id.value } });
          renderGrownups();
        });
      });
      $('#key-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        run(async () => {
          const { api_key } = await adminApi('/api-keys', { method: 'POST', body: { name: e.target.elements.name.value } });
          await renderGrownups();
          $('#key-out').innerHTML = `<p class="muted" style="margin-top:12px">Copy this now — it won’t be shown again:</p>
            <div class="secret">${esc(api_key.key)}</div>`;
        });
      });
    }

    // ---------- boot ----------
    (async () => {
      try {
        window.__khBooted = true;
        state.me = await adminApi('/me');
        $('#who').textContent = `Signed in as ${state.me.adult.name || state.me.adult.email}`;
        await refreshCore();
        render();
      } catch (err) {
        main.innerHTML = `<div class="card"><h2>Can’t open parent mode</h2><p>${esc(err.message)}</p></div>`;
      }
    })();
