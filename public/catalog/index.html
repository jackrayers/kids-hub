<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Santa’s Catalog</title>
  <meta name="theme-color" content="#b9302a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Chewy&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Chewy&display=swap"></noscript>
  <link rel="stylesheet" href="/shared/ui.css">
  <style>
    body.santa-app { padding-top: 0; background: var(--cream); padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
    .shop {
      margin: 0 -20px 6px;
      padding: env(safe-area-inset-top) 0 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.06) 0 60px, transparent 61px),
        radial-gradient(circle at 85% 70%, rgba(255, 255, 255, 0.05) 0 90px, transparent 91px),
        linear-gradient(180deg, #17583c 0%, #1f6b4a 100%);
    }
    .shop .lights { margin-top: -18px; position: relative; z-index: 3; }
    .shop-row {
      position: relative; z-index: 2; display: flex; align-items: center; gap: 14px;
      max-width: 1100px; margin: 0 auto; padding: 0 20px;
    }
    .shop-row h1 {
      flex: 1; min-width: 0; margin: 46px 0 0; font-size: clamp(2.3rem, 8vw, 4.6rem); --wm-outline: #0f3d29;
    }
    .shop-row .back-btn { text-decoration: none; }
    @media (max-width: 560px) {
      .shop-row { flex-wrap: wrap; justify-content: center; }
      .shop-row .back-btn { position: absolute; left: 16px; top: 2px; padding: 6px 14px; font-size: 1rem; }
      .shop-row h1 { flex-basis: 100%; margin-top: 54px; }
      .sleigh { width: 96px; top: calc(env(safe-area-inset-top) + 50px); }
      .tray .slot { width: 56px; height: 56px; border-radius: 14px; }
      .tray .letter-btn { padding: 12px 16px 8px; font-size: 1.2rem; }
      .tray .tray-in { gap: 10px; }
    }
    .sleigh { top: calc(env(safe-area-inset-top) + 66px); width: 140px; z-index: 1; opacity: 0.9; }
    .shop .edge { margin-top: 2px; height: 60px; }
    .filters { display: flex; gap: 10px; overflow-x: auto; max-width: 1100px; margin: 4px auto 20px; padding: 4px 2px 10px; scrollbar-width: none; }
    .filters button {
      flex: none; border: 3px solid #f0e4d2; border-radius: 999px; padding: 6px 18px 4px; background: var(--paper);
      font: 700 1.2rem/1 var(--font-fun); display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
    }
    .filters button span.e { font-size: 1.6rem; }
    .filters button[aria-pressed='true'] { background: var(--gold); border-color: #e3a414; }
    /* Toy-shop wall: wallpaper behind, a wooden shelf under every row of toys. */
    .wall {
      margin: 0 -20px;
      padding: 26px 20px 40px;
      background:
        radial-gradient(circle, rgba(201, 58, 50, 0.10) 2px, transparent 3px) 13px 13px / 52px 52px,
        repeating-linear-gradient(90deg, #fff7ea 0 26px, #fdf0dc 26px 52px);
      border-top: 6px solid #e9d7bd;
    }
    .toys {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      column-gap: 0; row-gap: 30px; max-width: 1100px; margin: 0 auto;
    }
    .toy { position: relative; display: flex; flex-direction: column; align-items: center; outline: none; }
    .toy .stage { width: 100%; padding: 0 12px; position: relative; }
    .toy .stage img {
      display: block; width: 100%; aspect-ratio: 1; object-fit: contain; object-position: 50% 100%;
      filter: drop-shadow(0 7px 4px rgba(90, 50, 15, 0.28));
      transition: transform 0.15s ease;
    }
    .toy:active .stage img { transform: translateY(-4px) scale(1.03); }
    .toy:focus-visible .stage img { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 12px; }
    /* Pictures without a cutout sit in a little display box instead. */
    .toy.boxed .stage img {
      background: #fff; border-radius: 18px; padding: 6%; box-sizing: border-box;
      border: 4px solid #f1e2c9; filter: drop-shadow(0 6px 4px rgba(90, 50, 15, 0.22));
    }
    .plank {
      width: 100%; height: 20px; position: relative; z-index: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 90px, rgba(90, 50, 15, 0.10) 90px 92px),
        linear-gradient(180deg, #e2a66a 0, #c98b52 35%, #a96a36 100%);
      box-shadow: 0 10px 12px -6px rgba(90, 50, 15, 0.45);
    }
    .plank::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255, 236, 205, 0.55); }
    .tag {
      margin-top: 10px; max-width: 88%; padding: 4px 12px 2px 18px; position: relative;
      background: #fffdf8; border: 2px solid #e6d3b3; border-radius: 6px 10px 10px 6px;
      font: 700 1.05rem/1.15 var(--font-fun); text-align: center; color: var(--ink);
      transform: rotate(-2deg); box-shadow: 0 2px 0 rgba(90, 50, 15, 0.12);
    }
    .toy:nth-child(even) .tag { transform: rotate(2deg); }
    .tag::before { content: ''; position: absolute; left: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #e6d3b3; }
    .toy.spacer { pointer-events: none; }
    @media (max-width: 560px) {
      .toys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tag { font-size: 0.95rem; }
      .heart { width: 46px; height: 46px; font-size: 1.5rem; right: 4px; }
    }
    .heart {
      position: absolute; top: 0; right: 8px; width: 56px; height: 56px; border-radius: 50%; border: 0; z-index: 2;
      background: rgba(255, 255, 255, 0.95); font-size: 1.9rem; display: grid; place-items: center;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12); transition: transform 0.15s ease;
    }
    .heart[aria-pressed='true'] { background: #ffe1e1; }
    .heart:active { transform: scale(0.9); }
    .heart.pop { animation: pop 0.35s ease; }
    @keyframes pop { 40% { transform: scale(1.3); } }

    .tray {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--paper); box-shadow: 0 -8px 30px rgba(43, 33, 64, 0.15);
      border-radius: 28px 28px 0 0;
      padding: 14px max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .tray-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .tray-slots { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
    .slot { flex: none; width: 74px; height: 74px; border-radius: 18px; border: 3px dashed var(--line); background: var(--cream); overflow: hidden; padding: 0; }
    .slot img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .slot.filled { border: 3px solid var(--gold); }
    .letter-btn {
      flex: none; border: 0; border-radius: 22px; padding: 14px 22px 10px; background: var(--green); color: #fff;
      font: 800 1.4rem/1 var(--font-fun); box-shadow: 0 5px 0 var(--green-deep); text-decoration: none; display: inline-flex; gap: 8px; align-items: center;
    }
    .letter-btn[aria-disabled='true'] { opacity: 0.45; pointer-events: none; }

    .big { border: 0; padding: 0; width: min(560px, calc(100vw - 32px)); border-radius: 32px; overflow: hidden; }
    .big img { width: 100%; aspect-ratio: 1; object-fit: contain; background: radial-gradient(circle at 50% 60%, #fff 0, #fff3df 70%); padding: 6%; box-sizing: border-box; }
    .big .b { padding: 16px 20px 20px; display: grid; gap: 14px; }
    .big h2 { margin: 0; font: 800 1.8rem/1.1 var(--font-fun); }
    .big .row { display: flex; gap: 12px; }
    .big .row button { flex: 1; }
    .want { border: 0; border-radius: 20px; padding: 14px; font: 800 1.4rem/1 var(--font-fun); background: var(--red); color: #fff; box-shadow: 0 5px 0 var(--red-deep); }
    .want.on { background: var(--paper); color: var(--red-deep); box-shadow: inset 0 0 0 3px var(--red); }
    .close { border: 0; border-radius: 20px; padding: 14px; font: 700 1.3rem/1 var(--font-fun); background: var(--cream); }
    .bubble {
      position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
      background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 18px; font: 700 1.2rem/1.2 var(--font-fun); max-width: calc(100vw - 32px); text-align: center;
    }
    @media (prefers-reduced-motion: reduce) { .heart.pop { animation: none; } }
  </style>
</head>
<body class="kid santa-app">
  <header class="shop band" id="shop">
    <div class="awning" aria-hidden="true"></div>
    <div class="lights" aria-hidden="true"></div>

    <svg class="sleigh drift" style="animation-duration:38s;animation-delay:-12s" viewBox="0 0 220 90" aria-hidden="true">
      <!-- reindeer -->
      <g fill="#b9773f" stroke="#7a4a22" stroke-width="2">
        <ellipse cx="168" cy="44" rx="20" ry="11"/><circle cx="190" cy="32" r="8"/>
        <path d="M152 52 l-4 16 M162 54 l-2 16 M176 54 l2 16 M184 50 l5 15" fill="none" stroke-linecap="round" stroke-width="4"/>
      </g>
      <path d="M186 24 l-4 -12 m2 6 l-7 -3 M194 24 l4 -12 m-2 6 l7 -3" stroke="#7a4a22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="198" cy="33" r="3.5" fill="#ff4a3d"/>
      <path d="M150 44 C130 40 110 46 96 50" stroke="#ffd84a" stroke-width="2" fill="none"/>
      <!-- sleigh with Santa and sack -->
      <circle cx="52" cy="26" r="15" fill="#8a5cd6"/><circle cx="64" cy="20" r="9" fill="#4f8fe8"/>
      <circle cx="78" cy="30" r="8" fill="#ffe6cf" stroke="#d9b597" stroke-width="1.5"/>
      <path d="M70 26 C72 10 88 6 92 20 Z" fill="#e4483f"/><circle cx="93" cy="20" r="4" fill="#fff"/>
      <path d="M71 33 C74 44 84 44 86 33 Z" fill="#fff"/>
      <path d="M30 36 H100 C104 36 104 60 92 62 H44 C30 62 24 48 30 36 Z" fill="#e4483f" stroke="#8f1f1a" stroke-width="2.5"/>
      <path d="M24 72 H104 C114 72 116 62 110 60" fill="none" stroke="#ffd84a" stroke-width="5" stroke-linecap="round"/>
      <path d="M48 62 V72 M88 62 V72" stroke="#ffd84a" stroke-width="4"/>
    </svg>

    <div class="shop-row">
      <a class="back-btn" href="/">↩ Back</a>
      <h1 class="wordmark" id="title">Santa’s Catalog</h1>
    </div>

    <svg class="edge" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 26 C80 46 150 8 240 24 C330 40 380 14 470 22 C560 30 610 50 700 34 C790 18 860 40 950 30 C1040 20 1110 44 1200 28 L1200 70 L0 70 Z" fill="#ffffff"/>
      <path d="M0 50 C200 40 400 60 600 50 C800 40 1000 62 1200 52 L1200 70 L0 70 Z" fill="var(--cream)"/>
    </svg>
  </header>
  <nav class="filters" id="filters" aria-label="Kinds of toys"></nav>
  <div class="wall"><main class="toys" id="toys"><p class="empty">Loading…</p></main></div>

  <div class="tray" id="tray" hidden>
    <div class="tray-in">
      <div class="tray-slots" id="slots" aria-label="My list"></div>
      <a class="letter-btn" id="letter-btn" href="#">✏️ <span>My letter</span></a>
    </div>
  </div>

  <dialog class="big" id="big">
    <img id="big-img" alt="">
    <div class="b">
      <h2 id="big-title"></h2>
      <div class="row">
        <button class="want" id="big-want" type="button"></button>
        <button class="close" id="big-close" type="button">Close</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    import { kidApi, esc, session, store, watchForUpdates } from '/shared/api.js';
    watchForUpdates();
    import { setWordmark, snow } from '/shared/whimsy.js';

    setWordmark(document.getElementById('title'), 'Santa’s Catalog',
      { colors: ['#ffffff', '#ffd84a', '#ff7a6e', '#ffffff', '#b8f0c8'], hatFirst: true });
    snow(document.getElementById('shop'), 30);

    const $ = (id) => document.getElementById(id);
    const kidId = new URLSearchParams(location.search).get('kid') || session.get('kh.kidId');
    if (!kidId) location.href = '/';

    let data = { toys: [], categories: [], wishlist: [], wishlist_max: 6 };
    let filter = 'all';
    let open = null;

    const wished = (id) => data.wishlist.includes(id);
    const toyById = (id) => data.toys.find((t) => t.id === id);

    function say(text) {
      document.querySelector('.bubble')?.remove();
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      document.body.append(b);
      setTimeout(() => b.remove(), 2600);
    }

    function renderFilters() {
      const chips = [{ id: 'all', name: 'Everything', icon: '✨' }, ...data.categories];
      $('filters').innerHTML = chips.map((c) => `
        <button type="button" data-cat="${esc(c.id)}" aria-pressed="${filter === c.id}" aria-label="${esc(c.name)}">
          <span class="e" aria-hidden="true">${esc(c.icon)}</span><span>${esc(c.name)}</span>
        </button>`).join('');
    }

    function renderToys() {
      const list = data.toys.filter((t) => filter === 'all' || t.category === filter);
      $('toys').innerHTML = list.length ? list.map((t) => `
        <div class="toy ${t.cutout ? '' : 'boxed'}" data-id="${esc(t.id)}" role="button" tabindex="0" aria-label="${esc(t.title)}">
          <div class="stage">
            <img src="${esc(t.image)}" alt="" loading="lazy">
            <button class="heart" type="button" data-heart="${esc(t.id)}" aria-pressed="${wished(t.id)}"
              aria-label="${wished(t.id) ? 'Take off my list' : 'Add to my list'}">${wished(t.id) ? '❤️' : '🤍'}</button>
          </div>
          <div class="plank" aria-hidden="true"></div>
          <div class="tag">${esc(t.title)}</div>
        </div>`).join('')
        : '<p class="empty" style="grid-column:1/-1">Santa’s elves are still filling the catalog. Check back soon!</p>';
      fillShelves();
    }

    // Pads the last row with empty shelf so every shelf runs the full width.
    function fillShelves() {
      const grid = $('toys');
      grid.querySelectorAll('.spacer').forEach((el) => el.remove());
      const items = grid.querySelectorAll('.toy').length;
      if (!items) return;
      const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
      const missing = (cols - (items % cols)) % cols;
      for (let i = 0; i < missing; i++) {
        const sp = document.createElement('div');
        sp.className = 'toy spacer';
        sp.setAttribute('aria-hidden', 'true');
        sp.innerHTML = '<div class="stage"><div style="aspect-ratio:1"></div></div><div class="plank"></div>';
        grid.append(sp);
      }
    }
    let resizeTimer;
    addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fillShelves, 150); });

    function renderTray() {
      $('tray').hidden = false;
      const slots = [];
      for (let i = 0; i < data.wishlist_max; i++) {
        const t = toyById(data.wishlist[i]);
        slots.push(t
          ? `<button class="slot filled" type="button" data-slot="${esc(t.id)}" aria-label="${esc(t.title)}"><img src="${esc(t.image)}" alt=""></button>`
          : '<span class="slot" aria-hidden="true"></span>');
      }
      $('slots').innerHTML = slots.join('');
      const btn = $('letter-btn');
      btn.href = `/letter/?kid=${encodeURIComponent(kidId)}`;
      btn.setAttribute('aria-disabled', data.wishlist.length ? 'false' : 'true');
    }

    function renderAll() { renderFilters(); renderToys(); renderTray(); }

    async function toggle(id) {
      const adding = !wished(id);
      try {
        const res = await kidApi('/wishlist', { method: adding ? 'POST' : 'DELETE', body: { kid_id: kidId, toy_id: id } });
        data.wishlist = res.wishlist;
        renderToys();
        renderTray();
        if (adding) {
          document.querySelector(`[data-heart="${CSS.escape(id)}"]`)?.classList.add('pop');
          say(data.wishlist.length >= data.wishlist_max ? 'Your list is full! Time to write your letter ✏️' : 'Added to your list! 🎁');
        }
        if (open === id) paintBig();
      } catch (err) {
        say(err.message);
      }
    }

    function paintBig() {
      const t = toyById(open);
      $('big-img').src = t.image;
      $('big-title').textContent = t.title;
      const on = wished(t.id);
      $('big-want').textContent = on ? '💔 Take off my list' : '❤️ I want this!';
      $('big-want').classList.toggle('on', on);
    }

    $('filters').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      filter = b.dataset.cat;
      renderFilters();
      renderToys();
    });
    $('toys').addEventListener('click', (e) => {
      const heart = e.target.closest('[data-heart]');
      if (heart) { e.stopPropagation(); toggle(heart.dataset.heart); return; }
      const card = e.target.closest('.toy');
      if (!card) return;
      open = card.dataset.id;
      paintBig();
      $('big').showModal();
    });
    $('toys').addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('toy')) { e.preventDefault(); e.target.click(); }
    });
    $('slots').addEventListener('click', (e) => {
      const s = e.target.closest('[data-slot]');
      if (!s) return;
      open = s.dataset.slot;
      paintBig();
      $('big').showModal();
    });
    $('big-want').addEventListener('click', () => toggle(open));
    $('big-close').addEventListener('click', () => $('big').close());
    $('big').addEventListener('click', (e) => { if (e.target === $('big')) $('big').close(); });

    // Draw straight away from the last visit, then refresh from the server.
    const cacheKey = `kh.cache.catalog.${kidId}`;
    let shownFromCache = false;
    try {
      const cached = JSON.parse(store.get(cacheKey) || 'null');
      if (cached?.toys) { data = cached; renderAll(); shownFromCache = true; }
    } catch { /* ignore */ }

    (async () => {
      try {
        data = await kidApi(`/catalog?kid=${encodeURIComponent(kidId)}`);
        store.set(cacheKey, JSON.stringify(data));
        session.set('kh.kidId', kidId);
        renderAll();
      } catch (err) {
        if (!shownFromCache) $('toys').innerHTML = `<p class="empty">${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
