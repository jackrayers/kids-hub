# Applies new D1 migrations to the production database whenever they land on main.
# Code deploys separately through Cloudflare Pages' Git integration.
# Needs repo secrets: CLOUDFLARE_API_TOKEN (Account → D1 → Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Migrate database

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to production D1
        run: npx wrangler d1 migrations apply kids-hub --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
